<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8f675b">
<link rel="manifest" href="manifest.json">
<title>てちょっと</title>
<link rel="icon" href="メモのイラスト.jpg">
<link rel="apple-touch-icon" href="メモのイラスト.jpg">
<style>
:root{
 --brown:#8f675b;
 --brown-dark:#745247;
 --bg:#f4e3df;
 --paper:#fffaf7;
 --line:#dfc9c2;
 --muted:#a4877e;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
 color:#604d46;
 background:var(--bg);
}
.app{
 height:100dvh;
 max-width:600px;
 margin:auto;
 background:var(--paper);
 display:flex;
 flex-direction:column;
}
header{
 padding:18px 18px 10px;
 background:#fffaf7;
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
}
.logo{
 font-size:25px;
 font-weight:700;
 color:var(--brown);
}
.sub{
 font-size:11px;
 color:var(--muted);
 margin-top:2px;
}
.page-info{
 font-size:11px;
 color:var(--muted);
}
/* 横スクロールするページ */
.pages{
 flex:1;
 overflow-x:auto;
 overflow-y:hidden;
 display:flex;
 scroll-snap-type:x mandatory;
 scrollbar-width:none;
}
.pages::-webkit-scrollbar{
 display:none;
}
.page{
 position:relative;
 flex:0 0 100%;
 height:100%;
 overflow:hidden;
 scroll-snap-align:start;
 background:
  radial-gradient(#ead8d3 0.8px,transparent .8px);
 background-size:16px 16px;
 background-color:#f8eeeb;
}
/* 付箋 */
.sticky{
 position:absolute;
 width:145px;
 min-height:115px;
 padding:15px 13px 13px;
 border:0;
 box-shadow:2px 4px 10px #7b5b541f;
 touch-action:none;
 color:#5e4b46;
 font-size:14px;
 line-height:1.55;
 overflow:hidden;
 border-radius:4px;
}
.sticky::before{
 content:"";
 position:absolute;
 top:0;
 left:50%;
 transform:translateX(-50%);
 width:42px;
 height:8px;
 background:#ffffff55;
}
.sticky textarea{
 width:100%;
 height:80px;
 border:0;
 background:transparent;
 resize:none;
 outline:none;
 color:inherit;
 font:inherit;
 line-height:1.55;
 padding:0;
 margin-top:4px;
}
.sticky .del{
 position:absolute;
 right:5px;
 top:4px;
 border:0;
 background:transparent;
 color:#876d65;
 font-size:14px;
 padding:2px 6px;
 cursor:pointer;
}
.sticky .rotate{
 position:absolute;
 right:6px;
 bottom:5px;
 border:0;
 background:transparent;
 color:#876d65;
 font-size:14px;
 cursor:pointer;
 padding:2px;
}
/* 下の操作バー */
.palette{
 position:absolute;
 left:12px;
 right:12px;
 bottom:12px;
 padding:10px;
 background:#fffaf7ee;
 border:1px solid #ead8d2;
 border-radius:20px;
 display:flex;
 gap:8px;
 align-items:center;
 justify-content:center;
 box-shadow:0 4px 16px #72564b18;
 backdrop-filter:blur(8px);
 z-index:10;
}
.add{
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:var(--brown);
 color:#fff;
 font-size:25px;
 box-shadow:0 4px 10px #75524735;
 cursor:pointer;
}
.swatch{
 width:31px;
 height:31px;
 border-radius:50%;
 border:2px solid #fff;
 box-shadow:0 1px 5px #6d51492b;
 cursor:pointer;
}
.swatch:active, .add:active{
 transform:scale(.9);
}
.info{
 font-size:11px;
 color:var(--muted);
 margin-right:3px;
}
/* ページ追加 */
.page-add{
 position:absolute;
 right:16px;
 top:12px;
 border:0;
 background:#fffaf7dd;
 color:var(--brown);
 border:1px solid #ead8d2;
 border-radius:14px;
 padding:7px 10px;
 font-size:11px;
 box-shadow:0 2px 8px #72564b18;
 cursor:pointer;
 z-index:10;
}
/* ページ移動 */
.page-nav{
 position:absolute;
 left:50%;
 bottom:78px;
 transform:translateX(-50%);
 display:flex;
 gap:8px;
 z-index:10;
}
.page-nav button{
 border:0;
 background:#fffaf7dd;
 color:var(--brown);
 width:36px;
 height:32px;
 border-radius:12px;
 box-shadow:0 2px 8px #72564b18;
 font-size:15px;
 cursor:pointer;
}
/* 初回説明 */
.modal{
 position:fixed;
 inset:0;
 background:#0004;
 display:none;
 align-items:flex-end;
 z-index:20;
}
.modal.show{
 display:flex;
}
.dialog{
 width:100%;
 max-width:600px;
 margin:auto;
 background:#fffaf7;
 border-radius:24px 24px 0 0;
 padding:22px 18px 30px;
}
.dialog h3{
 margin:0 0 8px;
 color:var(--brown);
}
.dialog p{
 font-size:13px;
 line-height:1.6;
 color:#806b64;
}
.btns{
 display:flex;
 gap:8px;
 margin-top:16px;
}
.btns button{
 flex:1;
 border:0;
 border-radius:13px;
 padding:12px;
 font-weight:700;
 cursor:pointer;
}
.primary{
 background:var(--brown);
 color:white;
}
</style>
</head>
<body>
<div class="app">
<header>
 <div>
  <div class="logo">てちょっと</div>
  <div class="sub">手帳がない日の、ちいさなページ</div>
 </div>
 <div class="page-info" id="pageInfo"></div>
</header>
<div class="pages" id="pages"></div>
</div>
<div class="modal" id="help">
 <div class="dialog">
  <h3>てちょっとの使い方</h3>
  <p>
   下の色をタップすると付箋を追加できます。<br>
   付箋は指でドラッグして好きな場所へ。<br>
   左右にスワイプするとページを移動できます。<br>
   「＋ ページ」で新しいページを追加できます。
  </p>
  <div class="btns">
   <button class="primary" onclick="closeHelp()">
    はじめる
   </button>
  </div>
 </div>
</div>
<div class="backup-btns" style="margin-top: 15px; display: flex; gap: 8px;">
  <button type="button" onclick="exportData()" style="font-size: 11px; padding: 6px;">バックアップ保存</button>
  <button type="button" onclick="importData()" style="font-size: 11px; padding: 6px;">復元</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="loadImportFile(event)">
</div>
<script src="app.js"></script>
</body>
</html>
