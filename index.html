<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9a7165">
<link rel="manifest" href="manifest.json">
<title>てちょっと</title>
<style>
:root{
 --brown:#8f675b;
 --brown-dark:#745247;
 --bg:#f4e3df;
 --paper:#fffaf7;
 --line:#dfc9c2;
 --muted:#a4877e;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
 color:#604d46;
 background:var(--bg);
}
.app{
 height:100dvh;
 max-width:600px;
 margin:auto;
 background:var(--paper);
 display:flex;
 flex-direction:column;
}
header{
 padding:18px 18px 10px;
 background:#fffaf7;
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
}
.logo{
 font-size:25px;
 font-weight:700;
 color:var(--brown);
}
.sub{
 font-size:11px;
 color:var(--muted);
 margin-top:2px;
}
.page-info{
 font-size:11px;
 color:var(--muted);
}
/* 横スクロールするページ */
.pages{
 flex:1;
 overflow-x:auto;
 overflow-y:hidden;
 display:flex;
 scroll-snap-type:x mandatory;
 scrollbar-width:none;
}
.pages::-webkit-scrollbar{
 display:none;
}
.page{
 position:relative;
 flex:0 0 100%;
 height:100%;
 overflow:hidden;
 scroll-snap-align:start;
 background:
  radial-gradient(#ead8d3 0.8px,transparent .8px);
 background-size:16px 16px;
 background-color:#f8eeeb;
}
/* 付箋 */
.sticky{
 position:absolute;
 width:145px;
 min-height:115px;
 padding:15px 13px 13px;
 border:0;
 box-shadow:2px 4px 10px #7b5b541f;
 touch-action:none;
 color:#5e4b46;
 font-size:14px;
 line-height:1.55;
 overflow:hidden;
 border-radius:4px;
}
.sticky::before{
 content:"";
 position:absolute;
 top:0;
 left:50%;
 transform:translateX(-50%);
 width:42px;
 height:8px;
 background:#ffffff55;
}
.sticky textarea{
 width:100%;
 height:80px;
 border:0;
 background:transparent;
 resize:none;
 outline:none;
 color:inherit;
 font:inherit;
 line-height:1.55;
 padding:0;
 margin-top:4px;
}
.sticky .del{
 position:absolute;
 right:5px;
 top:4px;
 border:0;
 background:transparent;
 color:#876d65;
 font-size:14px;
 padding:2px 6px;
 cursor:pointer;
}
.sticky .rotate{
 position:absolute;
 right:6px;
 bottom:5px;
 border:0;
 background:transparent;
 color:#876d65;
 font-size:14px;
 cursor:pointer;
 padding:2px;
}
/* 下の操作バー */
.palette{
 position:absolute;
 left:12px;
 right:12px;
 bottom:12px;
 padding:10px;
 background:#fffaf7ee;
 border:1px solid #ead8d2;
 border-radius:20px;
 display:flex;
 gap:8px;
 align-items:center;
 justify-content:center;
 box-shadow:0 4px 16px #72564b18;
 backdrop-filter:blur(8px);
 z-index:10;
}
.add{
 width:48px;
 height:48px;
 border:0;
 border-radius:50%;
 background:var(--brown);
 color:#fff;
 font-size:25px;
 box-shadow:0 4px 10px #75524735;
 cursor:pointer;
}
.swatch{
 width:31px;
 height:31px;
 border-radius:50%;
 border:2px solid #fff;
 box-shadow:0 1px 5px #6d51492b;
 cursor:pointer;
}
.swatch:active, .add:active{
 transform:scale(.9);
}
.info{
 font-size:11px;
 color:var(--muted);
 margin-right:3px;
}
/* ページ追加 */
.page-add{
 position:absolute;
 right:16px;
 top:12px;
 border:0;
 background:#fffaf7dd;
 color:var(--brown);
 border:1px solid #ead8d2;
 border-radius:14px;
 padding:7px 10px;
 font-size:11px;
 box-shadow:0 2px 8px #72564b18;
 cursor:pointer;
 z-index:10;
}
/* ページ移動 */
.page-nav{
 position:absolute;
 left:50%;
 bottom:78px;
 transform:translateX(-50%);
 display:flex;
 gap:8px;
 z-index:10;
}
.page-nav button{
 border:0;
 background:#fffaf7dd;
 color:var(--brown);
 width:36px;
 height:32px;
 border-radius:12px;
 box-shadow:0 2px 8px #72564b18;
 font-size:15px;
 cursor:pointer;
}
/* 初回説明 */
.modal{
 position:fixed;
 inset:0;
 background:#0004;
 display:none;
 align-items:flex-end;
 z-index:20;
}
.modal.show{
 display:flex;
}
.dialog{
 width:100%;
 max-width:600px;
 margin:auto;
 background:#fffaf7;
 border-radius:24px 24px 0 0;
 padding:22px 18px 30px;
}
.dialog h3{
 margin:0 0 8px;
 color:var(--brown);
}
.dialog p{
 font-size:13px;
 line-height:1.6;
 color:#806b64;
}
.btns{
 display:flex;
 gap:8px;
 margin-top:16px;
}
.btns button{
 flex:1;
 border:0;
 border-radius:13px;
 padding:12px;
 font-weight:700;
 cursor:pointer;
}
.primary{
 background:var(--brown);
 color:white;
}
</style>
</head>
<body>
<div class="app">
<header>
 <div>
  <div class="logo">てちょっと</div>
  <div class="sub">手帳がない日の、ちいさなページ</div>
 </div>
 <div class="page-info" id="pageInfo"></div>
</header>
<div class="pages" id="pages"></div>
</div>
<div class="modal" id="help">
 <div class="dialog">
  <h3>てちょっとの使い方</h3>
  <p>
   下の色をタップすると付箋を追加できます。<br>
   付箋は指でドラッグして好きな場所へ。<br>
   左右にスワイプするとページを移動できます。<br>
   「＋ ページ」で新しいページを追加できます。
  </p>
  <div class="btns">
   <button class="primary" onclick="closeHelp()">
    はじめる
   </button>
  </div>
 </div>
</div>
<script>
const KEY = 'techo-sticky-pages-v1';

function generateUUID() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

let data = JSON.parse(
 localStorage.getItem(KEY) ||
 JSON.stringify({
  currentPage: 0,
  pages: [
   {
    id: generateUUID(),
    notes: []
   }
  ]
 })
);

const pagesEl = document.getElementById('pages');
const pageInfo = document.getElementById('pageInfo');
let currentPage = data.currentPage || 0;

/* 保存 */
function save(){
 data.currentPage = currentPage;
 localStorage.setItem(KEY, JSON.stringify(data));
 updatePageInfo();
}

/* ページ番号 */
function updatePageInfo(){
 pageInfo.textContent = (currentPage + 1) + ' / ' + data.pages.length;
}

/* 付箋追加 */
function addNote(color){
 if (!data.pages[currentPage]) return;
 const page = data.pages[currentPage];
 const pageEl = pagesEl.children[currentPage] || pagesEl;
 const r = pageEl.getBoundingClientRect();
 const id = generateUUID();
 const note = {
  id: id,
  color: color,
  x: Math.max(10, (r.width - 145) / 2),
  y: 35 + page.notes.length * 12,
  text: '',
  rot: Number((Math.random() * 4 - 2).toFixed(1))
 };
 page.notes.push(note);
 save();
 render();
 setTimeout(() => {
  const el = document.querySelector(`[data-id="${id}"] textarea`);
  el?.focus();
 }, 30);
}

/* 付箋削除 */
function removeNote(id){
 const page = data.pages[currentPage];
 page.notes = page.notes.filter(n => n.id !== id);
 save();
 render();
}

/* ページ追加 */
function addPage(){
 data.pages.push({
  id: generateUUID(),
  notes: []
 });
 currentPage = data.pages.length - 1;
 save();
 render();
 setTimeout(() => {
  pagesEl.scrollTo({
   left: pagesEl.clientWidth * currentPage,
   behavior: 'smooth'
  });
 }, 50);
}

/* ページ描画 */
function render(){
 pagesEl.innerHTML = '';
 data.pages.forEach((page, index) => {
  const pageEl = document.createElement('div');
  pageEl.className = 'page';
  pageEl.dataset.page = index;
  pageEl.innerHTML = `
   <button type="button" class="page-add" onclick="addPage()">＋ ページ</button>
   <div class="palette">
    <span class="info">付箋</span>
    <button type="button" class="swatch" style="background:#f4c9d1" onclick="addNote('#f4c9d1')"></button>
    <button type="button" class="swatch" style="background:#ead4a7" onclick="addNote('#ead4a7')"></button>
    <button type="button" class="swatch" style="background:#d8cbea" onclick="addNote('#d8cbea')"></button>
    <button type="button" class="swatch" style="background:#c9dfd2" onclick="addNote('#c9dfd2')"></button>
    <button type="button" class="swatch" style="background:#f2dfb8" onclick="addNote('#f2dfb8')"></button>
    <button type="button" class="swatch" style="background:#e6c9ba" onclick="addNote('#e6c9ba')"></button>
    <button type="button" class="add" onclick="addNote('#f4c9d1')">＋</button>
   </div>
   <div class="page-nav">
    <button type="button" onclick="goPage(-1)">‹</button>
    <button type="button" onclick="goPage(1)">›</button>
   </div>
  `;
  page.notes.forEach(note => {
   createNoteElement(pageEl, note);
  });
  pagesEl.appendChild(pageEl);
 });
 updatePageInfo();
}

/* 付箋を作る */
function createNoteElement(pageEl, n){
 const el = document.createElement('div');
 el.className = 'sticky';
 el.dataset.id = n.id;
 el.style.background = n.color;
 el.style.left = n.x + 'px';
 el.style.top = n.y + 'px';
 el.style.transform = `rotate(${n.rot}deg)`;
 el.innerHTML = `
  <button type="button" class="del" aria-label="削除">×</button>
  <textarea placeholder="ここに書く…"></textarea>
  <button type="button" class="rotate" aria-label="回転">↻</button>
 `;

 const ta = el.querySelector("textarea");
 ta.value = n.text;

 ta.addEventListener("input", () => {
  n.text = ta.value;
  save();
 });

 el.querySelector(".del").onclick = e => {
  e.stopPropagation();
  removeNote(n.id);
 };

 el.querySelector(".rotate").onclick = e => {
  e.stopPropagation();
  n.rot = (Number(n.rot) + 2) % 8 - 4;
  save();
  render();
 };

 makeDraggable(el, n, pageEl);
 pageEl.appendChild(el);
}

/* 付箋をドラッグ */
function makeDraggable(el, n, pageEl){
 let sx, sy, ox, oy;
 let moved = false;

 const start = (x, y) => {
  sx = x;
  sy = y;
  ox = n.x;
  oy = n.y;
  moved = false;
  el.style.zIndex = Date.now() % 100000;
 };

 const move = (x, y) => {
  const r = pageEl.getBoundingClientRect();
  n.x = Math.max(-20, Math.min(r.width - 100, ox + x - sx));
  n.y = Math.max(5, Math.min(r.height - 105, oy + y - sy));
  el.style.left = n.x + "px";
  el.style.top = n.y + "px";
  moved = true;
 };

 const end = () => {
  if(moved){
   save();
  }
 };

 el.addEventListener("pointerdown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON") {
   return;
  }
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  start(e.clientX, e.clientY);
 });

 el.addEventListener("pointermove", e => {
  if (el.hasPointerCapture(e.pointerId)) {
   move(e.clientX, e.clientY);
  }
 });

 el.addEventListener("pointerup", end);
}

/* ページ移動 */
function goPage(direction){
 const next = currentPage + direction;
 if(next < 0 || next >= data.pages.length){
  return;
 }
 currentPage = next;
 save();
 pagesEl.scrollTo({
  left: pagesEl.clientWidth * currentPage,
  behavior: "smooth"
 });
}

/* 横スワイプ */
let scrollTimer;
pagesEl.addEventListener("scroll", () => {
 clearTimeout(scrollTimer);
 scrollTimer = setTimeout(() => {
  const index = Math.round(pagesEl.scrollLeft / pagesEl.clientWidth);
  if(index !== currentPage && index >= 0 && index < data.pages.length){
   currentPage = index;
   save();
  }
 }, 80);
});

/* 初回説明を閉じる */
function closeHelp(){
 document.getElementById("help").classList.remove("show");
 localStorage.setItem("techo-help", "1");
}

/* 起動 */
render();

if(!localStorage.getItem("techo-help")){
 document.getElementById("help").classList.add("show");
}

/* Service Worker */
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
