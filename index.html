<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8f675b">

<!-- アイコン設定 -->
<link rel="icon" href="読書猫さん.png">
<link rel="apple-touch-icon" href="読書猫さん.png">
<link rel="manifest" href="manifest.json">

<title>てちょっと</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div>
   <div class="logo">てちょっと</div>
   <div class="sub">手帳がない日の、ちいさなページ</div>
  </div>
  <div class="header-right">
    <div class="page-info" id="pageInfo"></div>
    <button type="button" class="btn-help" onclick="openHelp()">⚙️ 使い方</button>
  </div>
</header>
<div class="pages" id="pages"></div>
</div>

<!-- 使い方・バックアップモーダル -->
<div class="modal" id="help">
 <div class="dialog">
  <h3>てちょっとの使い方</h3>
  <p>
    下の色をタップすると付箋を追加できます。<br>
    付箋は指でドラッグして好きな場所へ。<br>
    左右にスワイプするとページを移動できます。<br>
    「＋ ページ」で新しいページを追加できます。
  </p>

  <div class="backup-btns">
    <button type="button" class="btn-backup" onclick="exportData()">💾 バックアップ保存</button>
    <button type="button" class="btn-backup" onclick="importData()">📂 復元</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="loadImportFile(event)">
  </div>

  <div class="btns">
   <button class="primary" onclick="closeHelp()">
      とじる
   </button>
  </div>
 </div>
</div>

<script src="app.js"></script>
</body>
</html>
